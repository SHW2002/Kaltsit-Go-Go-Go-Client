<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="screen-orientation" content="landscape">
    <meta name="x5-orientation" content="landscape">
    <meta name="full-screen" content="yes">
    <meta name="x5-fullscreen" content="true">
    <title>Kaltsit Go Go Go !</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main id="unity-container">
      <canvas id="unity-canvas" width="1280" height="720" tabindex="-1"></canvas>

      <section id="unity-loading-bar" aria-label="游戏加载进度">
        <div id="unity-build-title">Kaltsit Go Go Go !</div>
        <div id="unity-progress-track">
          <div id="unity-progress-bar"></div>
        </div>
      </section>

      <div id="unity-warning" role="status"></div>

      <button id="unity-fullscreen-button" type="button" aria-label="全屏游玩" title="全屏">⛶</button>
    </main>

    <script>
      const container = document.querySelector('#unity-container');
      const canvas = document.querySelector('#unity-canvas');
      const loadingBar = document.querySelector('#unity-loading-bar');
      const progressBar = document.querySelector('#unity-progress-bar');
      const fullscreenButton = document.querySelector('#unity-fullscreen-button');
      const warningBanner = document.querySelector('#unity-warning');

      const mobileUserAgent = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      const touchDevice = navigator.maxTouchPoints > 1;
      const coarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      const isMobile = mobileUserAgent || (touchDevice && coarsePointer);
      let activeUnityInstance = null;
      let landscapeLocked = false;

      if (isMobile) {
        container.classList.add('unity-mobile');
        canvas.classList.add('unity-mobile');
      }

      function updateFullscreenButton() {
        fullscreenButton.style.display = !isMobile && activeUnityInstance ? 'block' : 'none';
      }

      function unityShowBanner(message, type) {
        const entry = document.createElement('div');
        entry.textContent = message;
        entry.className = type === 'error' ? 'unity-error' : 'unity-warning';
        warningBanner.appendChild(entry);
        warningBanner.style.display = 'block';

        if (type !== 'error') {
          window.setTimeout(function () {
            entry.remove();
            warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
          }, 5000);
        }
      }

      function lockLandscape() {
        const orientation = window.screen.orientation;
        if (!orientation || typeof orientation.lock !== 'function') {
          return Promise.resolve(false);
        }

        try {
          return Promise.resolve(orientation.lock('landscape'))
            .then(function () {
              landscapeLocked = true;
              return true;
            })
            .catch(function () {
              return false;
            });
        } catch (error) {
          return Promise.resolve(false);
        }
      }

      function requestMobileFullscreen() {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          return Promise.resolve(true);
        }

        const requestFullscreen = container.requestFullscreen || container.webkitRequestFullscreen;
        if (!requestFullscreen) {
          return Promise.resolve(false);
        }

        try {
          return Promise.resolve(requestFullscreen.call(container))
            .then(function () {
              return true;
            })
            .catch(function () {
              return false;
            });
        } catch (error) {
          return Promise.resolve(false);
        }
      }

      function attemptLandscapeMode() {
        if (!isMobile || landscapeLocked) {
          return;
        }

        lockLandscape().then(function (locked) {
          if (!locked && window.innerWidth < window.innerHeight) {
            requestMobileFullscreen().then(function (enteredFullscreen) {
              if (enteredFullscreen) {
                lockLandscape();
              }
            });
          }
        });
      }

      function attemptLandscapeFromGesture() {
        if (!isMobile || landscapeLocked) {
          return;
        }

        lockLandscape();
        if (window.innerWidth < window.innerHeight) {
          requestMobileFullscreen().then(function (enteredFullscreen) {
            if (enteredFullscreen) {
              lockLandscape();
            }
          });
        }
      }

      fullscreenButton.addEventListener('click', function () {
        if (activeUnityInstance) {
          activeUnityInstance.SetFullscreen(1);
        }
      });

      updateFullscreenButton();
      attemptLandscapeMode();
      if (isMobile) {
        const landscapeGestureEvent = window.PointerEvent ? 'pointerup' : 'touchend';
        document.addEventListener(landscapeGestureEvent, attemptLandscapeFromGesture, {
          capture: true,
          passive: true
        });
      }

      window.addEventListener('resize', updateFullscreenButton);
      document.addEventListener('fullscreenchange', function () {
        if (!document.fullscreenElement) {
          landscapeLocked = false;
        }
        attemptLandscapeMode();
      });
      document.addEventListener('webkitfullscreenchange', function () {
        if (!document.webkitFullscreenElement) {
          landscapeLocked = false;
        }
        attemptLandscapeMode();
      });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) {
          landscapeLocked = false;
          attemptLandscapeMode();
        }
      });
      window.addEventListener('orientationchange', function () {
        landscapeLocked = false;
        window.setTimeout(function () {
          updateFullscreenButton();
          attemptLandscapeMode();
        }, 100);
      });

      const buildUrl = 'Build';
      const loaderUrl = buildUrl + '/WebGL.loader.js';
      const config = {
        dataUrl: buildUrl + '/WebGL.data.unityweb',
        frameworkUrl: buildUrl + '/WebGL.framework.js.unityweb',
        codeUrl: buildUrl + '/WebGL.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "SHW Studio",
        productName: "Kaltsit Go Go Go !",
        productVersion: "1.2.1",
        showBanner: unityShowBanner
      };

      if (isMobile) {
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      }

      const loaderScript = document.createElement('script');
      loaderScript.src = loaderUrl;
      loaderScript.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBar.style.width = (progress * 100) + '%';
        }).then(function (unityInstance) {
          activeUnityInstance = unityInstance;
          loadingBar.style.display = 'none';
          updateFullscreenButton();
          attemptLandscapeMode();
        }).catch(function (error) {
          loadingBar.style.display = 'none';
          unityShowBanner(String(error), 'error');
        });
      };
      loaderScript.onerror = function () {
        loadingBar.style.display = 'none';
        unityShowBanner('游戏加载器下载失败，请刷新页面重试。', 'error');
      };
      document.body.appendChild(loaderScript);
    </script>
  </body>
</html>
