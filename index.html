<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Kaltsit Go Go Go !</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main id="unity-container">
      <canvas id="unity-canvas" width="1280" height="720" tabindex="-1"></canvas>

      <section id="unity-loading-bar" aria-label="游戏加载进度">
        <div id="unity-build-title">Kaltsit Go Go Go !</div>
        <div id="unity-progress-track">
          <div id="unity-progress-bar"></div>
        </div>
      </section>

      <div id="unity-warning" role="status"></div>

      <button id="unity-orientation-button" type="button" aria-label="快捷横屏">↻ 横屏</button>

      <div id="orientation-hint" aria-hidden="true">
        <div class="orientation-phone">↻</div>
        <div>点击“横屏”或手动旋转手机</div>
      </div>
    </main>

    <script>
      const container = document.querySelector('#unity-container');
      const canvas = document.querySelector('#unity-canvas');
      const loadingBar = document.querySelector('#unity-loading-bar');
      const progressBar = document.querySelector('#unity-progress-bar');
      const orientationButton = document.querySelector('#unity-orientation-button');
      const warningBanner = document.querySelector('#unity-warning');
      const orientationHint = document.querySelector('#orientation-hint');

      const mobileUserAgent = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      const touchDevice = navigator.maxTouchPoints > 1;
      const coarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      const isMobile = mobileUserAgent || (touchDevice && coarsePointer);
      let activeUnityInstance = null;

      if (isMobile) {
        container.classList.add('unity-mobile');
        canvas.classList.add('unity-mobile');
      } else {
        orientationButton.textContent = '⛶';
        orientationButton.setAttribute('aria-label', '全屏游玩');
      }

      function updateOrientationHint() {
        const isPortrait = window.innerHeight > window.innerWidth;
        orientationHint.classList.toggle('visible', isMobile && isPortrait);
        orientationButton.style.display = isMobile
          ? (isPortrait ? 'block' : 'none')
          : (activeUnityInstance ? 'block' : 'none');
      }

      function unityShowBanner(message, type) {
        const entry = document.createElement('div');
        entry.textContent = message;
        entry.className = type === 'error' ? 'unity-error' : 'unity-warning';
        warningBanner.appendChild(entry);
        warningBanner.style.display = 'block';

        if (type !== 'error') {
          window.setTimeout(function () {
            entry.remove();
            warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
          }, 5000);
        }
      }

      function requestLandscapeMode() {
        if (!isMobile) {
          if (activeUnityInstance) {
            activeUnityInstance.SetFullscreen(1);
          }
          return;
        }

        let fullscreenRequest = Promise.resolve();
        try {
          if (activeUnityInstance) {
            activeUnityInstance.SetFullscreen(1);
          } else if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
            fullscreenRequest = document.documentElement.requestFullscreen();
          }
        } catch (error) {
          fullscreenRequest = Promise.reject(error);
        }

        Promise.resolve(fullscreenRequest)
          .catch(function () {
          })
          .then(function () {
            if (window.screen.orientation && window.screen.orientation.lock) {
              return window.screen.orientation.lock('landscape');
            }

            throw new Error('Orientation lock is unavailable.');
          })
          .catch(function () {
            unityShowBanner('当前浏览器无法自动锁定横屏，请手动旋转手机。', 'warning');
          });
      }

      orientationButton.addEventListener('click', requestLandscapeMode);
      updateOrientationHint();
      window.addEventListener('resize', updateOrientationHint);
      window.addEventListener('orientationchange', function () {
        window.setTimeout(updateOrientationHint, 100);
      });

      const buildUrl = 'Build';
      const loaderUrl = buildUrl + '/WebGL.loader.js';
      const config = {
        dataUrl: buildUrl + '/WebGL.data.unityweb',
        frameworkUrl: buildUrl + '/WebGL.framework.js.unityweb',
        codeUrl: buildUrl + '/WebGL.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "SHW Studio",
        productName: "Kaltsit Go Go Go !",
        productVersion: "1.2.1",
        showBanner: unityShowBanner
      };

      if (isMobile) {
        config.devicePixelRatio = 1;
      }

      const loaderScript = document.createElement('script');
      loaderScript.src = loaderUrl;
      loaderScript.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBar.style.width = (progress * 100) + '%';
        }).then(function (unityInstance) {
          activeUnityInstance = unityInstance;
          loadingBar.style.display = 'none';
          updateOrientationHint();
        }).catch(function (error) {
          loadingBar.style.display = 'none';
          unityShowBanner(String(error), 'error');
        });
      };
      loaderScript.onerror = function () {
        loadingBar.style.display = 'none';
        unityShowBanner('游戏加载器下载失败，请刷新页面重试。', 'error');
      };
      document.body.appendChild(loaderScript);
    </script>
  </body>
</html>
